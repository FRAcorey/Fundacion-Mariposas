<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="LoginStyle.css">
    <title>Login - Fundación Mariposa Azul</title>
</head>
<body>

<form class="card" onsubmit="return false;">
  <div class="avatar">
    <svg viewBox="0 0 24 24">
      <path d="M4 8h3l2-2h6l2 2h3v11H4z"/>
      <circle cx="12" cy="13" r="3.2"/>
      <img src="/imagenes/FundacionLogo.png" alt="Logo de la Fundación Mariposa Azul" class="logo">
    </svg>
  </div>

  <div class="field">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.2"/><path d="M5 20c0-4 3.2-6 7-6s7 2 7 6"/></svg>
    <input type="text" placeholder="Usuario" id="user">
  </div>

  <div class="field">
    <svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
    <input type="password" placeholder="Contraseña" id="contra">
  </div>

  <button type="button" id="inicioSesion" onclick="enviar()">INICIAR SESION</button><br><br>
  
  <button type="button" onclick="window.location.href='Index.html'">INVITADO</button>


</form>

  <script> 

    const user = document.getElementById("user");
    const contra = document.getElementById("contra");

    let usuario = "seba";
    let contraseña = "1234";

    let admin = "admin";
    let contraseñaAdmin = "123";

    function enviar() {

        let nombre = user.value;
        let clave = contra.value;

        // ADMINISTRADOR
        if (nombre.toUpperCase() == admin.toUpperCase() && clave == contraseñaAdmin) {

            localStorage.setItem("rol", "admin");
            alert("Bienvenido Administrador")
            window.location.href = "Index.html";

        // USUARIO NORMAL
        } else if (nombre.toUpperCase() == usuario.toUpperCase() && clave == contraseña) {

            localStorage.setItem("rol", "usuario");
            alert("Bienvenido Invitado");
            window.location.href = "Index.html";

        // DATOS INCORRECTOS
        } else {

            alert("Usuario o contraseña incorrectos");

        }
    }
    
</script>


  
</body>
</html>
