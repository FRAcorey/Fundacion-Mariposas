<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear noticia</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/noticiaStyle.css">
</head>

<body>

  <div class="container py-5">

    <div class="encabezado text-center mb-4">
      <h1>Crear noticia</h1>
      <p class="text-secondary">Completá los datos y generá el código para pegar en la sección de noticias</p>
      <a href="/index.html" class="text-decoration-none" style="color:var(--azul-700)">← Volver a noticias</a>
    </div>

    <div class="row g-4">


      <!-- FORMULARIO -->
      <div class="col-lg-6">
        <div class="panel-form">
          <h2>📝 Datos de la noticia</h2>

          <form id="form-noticia">

            <div class="mb-3">
              <label for="campo-categoria" class="form-label fw-semibold">
                Categoría
              </label>

              <select class="form-select" id="campo-categoria" name="categoria">
                <option value="arte">Arte</option>
                <option value="musica">Música</option>
                <option value="deporte">Deporte</option>
                <option value="evento">Evento</option>
              </select>
            </div>

            <div class="mb-3">
              <label for="campo-fecha" class="form-label fw-semibold">
                Fecha
              </label>

              <input type="text" class="form-control" id="campo-fecha" name="fecha" placeholder="Ej: 2026-05-21"
                required>
            </div>

            <div class="mb-3">
              <label for="campo-titulo" class="form-label fw-semibold">
                Título
              </label>

              <input type="text" class="form-control" id="campo-titulo" name="titulo"
                placeholder="Ej: Terminamos el mural colectivo del patio" required>
            </div>

            <div class="mb-3">
              <label for="campo-parrafo" class="form-label fw-semibold">
                Párrafo
              </label>

              <textarea class="form-control" id="campo-parrafo" name="parrafo" rows="4"
                placeholder="Contá de qué se trató la actividad..." required></textarea>
            </div>

            <div class="mb-3">
              <label for="campo-imagen" class="form-label fw-semibold">
                Imagen
              </label>

              <input type="file" class="form-control" id="campo-imagen" name="imagen" accept=".jpg,.jpeg,.png,.webp">
            </div>

            <button type="button" class="btn w-100" style="background: var(--azul-700); color: white;"
              onclick="publicarNoticia()">
              Publicar noticia
            </button>

          </form>
        </div>
      </div>


      <!-- VISTA PREVIA -->
      <div class="col-lg-6" id="previa">
        <div class="panel-previa mb-3">

          <h2>👀 Vista previa</h2>

          <div class="card-noticia">

            <img id="previa-imagen" src="https://placehold.co/400x220/e6e6e6/999999?text=Imagen" alt="Vista previa">

            <div class="p-3">

              <span class="badge-cat badge-arte" id="previa-badge">
                Arte
              </span>

              <p class="fecha-noticia mt-2 mb-1" id="previa-fecha">
                18 de julio, 2026
              </p>

              <h5 id="previa-titulo">
                Título de la noticia
              </h5>

              <p class="text-secondary small" id="previa-parrafo">
                Acá va a aparecer el párrafo que escribas en el formulario.
              </p>

              <a href="#" id="previa-link" class="fw-bold text-decoration-none" style="color: var(--azul-700);">
                Leer más →
              </a>

              <button type="button" class="btn w-100" style="background: var(--azul-700); color: white;"
              onclick="actualizarPrevia()">
              Actualizar vista previa
            </button>
            </div>
          </div>
    </div>
  </div>
</div>
</div>

  <script>

    const ApiKey = "sb_publishable_P7FSsXDyYBMEvZzkjVm7nA_E0vo-qNH";
    const SupabaseUrl = "https://rmnnjxletaweppdvipgs.supabase.co/rest/v1/";

    const categorias = {
      arte: { badge: 'badge-arte', etiqueta: 'Arte' },
      musica: { badge: 'badge-musica', etiqueta: 'Música' },
      deporte: { badge: 'badge-deporte', etiqueta: 'Deporte' },
      evento: { badge: 'badge-evento', etiqueta: 'Evento' }
    };

    const inputImagen = document.getElementById('campo-imagen');
    const previaImagen = document.getElementById('previa-imagen');
    const avisoFormato = document.getElementById('aviso-formato');

    inputImagen.addEventListener('change', function () {
     const archivo = this.file[0];

     if (archivo) {
     
     const lector = new FileReader();
     lector.onload = e =>previaImagen.src = e.target.result;
     lector.readAsDataURL(archivo);

     }
    });
  
    document.getElementById('campo-categoria').addEventListener('change', actualizarPreviaCategoria);
    actualizarPreviaCategoria();

    function actualizarPreviaCategoria() {
      const cat = categorias[document.getElementById('campo-categoria').value];
      const badge = document.getElementById('previa-badge');
      badge.className = 'badge-cat ' + cat.badge;
      badge.textContent = cat.etiqueta;
    }

    function escaparHTML(texto) {
      const div = document.createElement('div');
      div.textContent = texto;
      return div.innerHTML;
    }

    function actualizarPrevia() {
      const catKey = document.getElementById('campo-categoria').value;
      const cat = categorias[catKey];
      const fecha = document.getElementById('campo-fecha').value.trim() || 'Fecha pendiente';
      const titulo = document.getElementById('campo-titulo').value.trim() || 'Título de la noticia';
      const parrafo = document.getElementById('campo-parrafo').value.trim() || 'Escribí el contenido de la noticia.';

      // Actualiza vista previa
      document.getElementById('previa-fecha').textContent = fecha;
      document.getElementById('previa-titulo').textContent = titulo;
      document.getElementById('previa-parrafo').textContent = parrafo;
    }

    async function publicarNoticia() {

    const titulo = document.getElementById("campo-titulo").value.trim();
    const parrafo = document.getElementById("campo-parrafo").value.trim();
    const categoria = document.getElementById("campo-categoria").value;
    const fecha = document.getElementById("campo-fecha").value;

    if (!titulo || !parrafo || !categoria || !fecha) {
        alert("Por favor completá todos los campos");
        return;
    }

    try {

        const respuesta = await fetch(
            SupabaseUrl + "noticias",
            {
                method: "POST",

                headers: {
                    "apikey": ApiKey,
                    "Authorization": `Bearer ${ApiKey}`,
                    "Content-Type": "application/json",
                    "Prefer": "return=representation"
                },

                body: JSON.stringify({
                    titulo: titulo,
                    parrafo: parrafo,
                    categoria: categoria,
                    fecha: fecha
                })
            }
        );

        const resultado = await respuesta.json();

        console.log("Status:", respuesta.status);
        console.log("Resultado:", resultado);

        if (respuesta.ok) {

            alert("Noticia publicada correctamente");

            // Limpiar formulario
            document.getElementById("form-noticia");

        } else {

            console.error("Error de Supabase:", resultado);

            alert(
                "Error al publicar: " +
                (resultado.message || "Error desconocido")
            );

        }

    } catch (error) {

        console.error("Error de conexión:", error);

        alert("Ocurrió un error al conectar con Supabase");

    }
}



  </script>
</body>
</html>
